defaults:
  - override /database@_global_: island_small
  - override /evolution@_global_: small_budget
  - override /task@_global_: erdos_setup_b
  - override /cluster@_global_: local
  - _self_

variant_suffix: "_setup_b"

max_evaluation_jobs: 4
max_proposal_jobs: 4
max_db_workers: 2

db_config:
  num_islands: 4
  archive_size: 60
  parent_selection_strategy: "weighted"
  parent_selection_lambda: 5.0
  migration_interval: 15
  migration_rate: 0.15

evo_config:
  num_generations: 400
  max_api_costs: 6.0
  patch_types: ["diff", "full", "cross"]
  patch_type_probs: [0.6, 0.2, 0.2]
  llm_models:
    - "claude-sonnet-5"
    - "claude-opus-5"
  llm_dynamic_selection: "ucb1"
  llm_kwargs:
    temperatures: [0.5, 0.75, 1.0]
    max_tokens: 16384
    reasoning_efforts: "disabled"
  meta_rec_interval: 10
  meta_llm_models:
    - "claude-haiku-4-5-20251001"
  novelty_llm_models:
    - "claude-haiku-4-5-20251001"
  embedding_model: "text-embedding-3-small"
  code_embed_sim_threshold: 0.95
