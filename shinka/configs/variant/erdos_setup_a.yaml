defaults:
  - override /database@_global_: island_small
  - override /evolution@_global_: small_budget
  - override /task@_global_: erdos_setup_a
  - override /cluster@_global_: local
  - _self_

variant_suffix: "_setup_a"

max_evaluation_jobs: 2
max_proposal_jobs: 2
max_db_workers: 2

db_config:
  num_islands: 2
  archive_size: 40
  parent_selection_strategy: "power_law"
  exploitation_alpha: 10.0
  migration_interval: 20
  migration_rate: 0.1

evo_config:
  num_generations: 300
  max_api_costs: 5.0
  patch_types: ["diff", "full", "cross"]
  patch_type_probs: [0.7, 0.1, 0.2]
  llm_models:
    - "claude-sonnet-5"
    - "claude-haiku-4-5-20251001"
  llm_dynamic_selection: "ucb1"
  llm_kwargs:
    temperatures: [0.3, 0.5, 0.7]
    max_tokens: 16384
    reasoning_efforts: "disabled"
  meta_rec_interval: 15
  meta_llm_models:
    - "claude-haiku-4-5-20251001"
  novelty_llm_models:
    - "claude-haiku-4-5-20251001"
  embedding_model: "text-embedding-3-small"
  code_embed_sim_threshold: 0.98
