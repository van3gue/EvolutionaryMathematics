defaults:
  - override /database@_global_: island_small
  - override /evolution@_global_: small_budget
  - override /task@_global_: minimal_overlap
  - override /cluster@_global_: local
  - _self_

variant_suffix: "_test"

max_evaluation_jobs: 2
max_proposal_jobs: 2
max_db_workers: 2

evo_config:
  num_generations: 20
  max_api_costs: 2.0
  patch_types:
    - "diff"
    - "full"
    - "cross"
  patch_type_probs:
    - 0.4
    - 0.3
    - 0.3
  llm_models:
    - "claude-haiku-4-5-20251001"
  llm_dynamic_selection: null
  meta_rec_interval: null
  meta_llm_models:
    - "claude-haiku-4-5-20251001"
  novelty_llm_models:
    - "claude-haiku-4-5-20251001"
  embedding_model: null
